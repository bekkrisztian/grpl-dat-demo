version: v2beta1
name: grpl-dat-demo
vars:
  APP_NAME: "dat-demo"
  IMAGE_REGISTRY: "grpl"
  IMAGE_REPO: "grpl-dat-demo"
  
  APP_IMAGE: "${IMAGE_REGISTRY}/${IMAGE_REPO}"
  TEST_IMAGE: "${IMAGE_REGISTRY}/${IMAGE_REPO}-test"
  DATA_IMAGE: "${IMAGE_REGISTRY}/${IMAGE_REPO}-data" # currently not being used
  MODULES_IMAGE: "${IMAGE_REGISTRY}/${IMAGE_REPO}-modules"
  
  APP_DOCKERFILE: "Dockerfile"
  TEST_DOCKERFILE: "Dockerfile.test"
  DATA_DOCKERFILE: "Dockerfile.data" # currently not being used
  MODULES_DOCKERFILE: "Dockerfile.modules"
  
  # here you need to define the images to build and their coresponding dockerfiles
  IMAGES: "${APP_IMAGE}:${TAG} ${TEST_IMAGE}:${TAG} ${MODULES_IMAGE}:${TAG}"
  DOCKERFILES: "${APP_DOCKERFILE} ${TEST_DOCKERFILE} ${MODULES_DOCKERFILE}"
# This is a list of `pipelines` that DevSpace can execute (you can define your own)
functions:
  patch-values-file: |-
    task patch-values-file
  patch-values-file-modules: |-
    task patch-values-file-modules
  patch-values-file-patches-only: |-
    task patch-values-file-patches-only
  reset-values-file: |-
    task reset-values-file
pipelines:
  build: |-
    build_images --all
  build-app: |-
    build_images app
  # This is the pipeline for the main command: `devspace dev` (or `devspace run-pipeline dev`)
  dev:
    run: |-
      patch-values-file-patches-only
      run_dependencies --all       # 1. Deploy any projects this project needs (see "dependencies")
      ensure_pull_secrets --all    # 2. Ensure pull secrets
      build_images --all -t $(git describe --always)    # 3. Build, tag (git commit hash) and push all images (see "images")
      patch-values-file-modules
      # build_images data -t data    # 3. Build, tag ("data") and push the data image (see "images")
      create_deployments --all     # 3. Deploy Helm charts and manifests specfied as "deployments"
      echo "waiting on chart deployment..."
      reset-values-file
      kubectl wait deployment -l app.kubernetes.io/name=grapi,grpl.io/resourceName=${APP_NAME}-gras-grapi --for=condition=Available --timeout=600s
      kubectl wait deployment -l app.kubernetes.io/name=gruim,grpl.io/resourceName=${APP_NAME}-gras-gruim --for=condition=Available --timeout=600s
      kubectl wait deployment -l app.kubernetes.io/name=gruim,grpl.io/resourceName=${APP_NAME}-grascache-gruim --for=condition=Available --timeout=600s
      start_dev grapi
      start_dev gruim
      start_dev gruim-cache
      if grpl > /dev/null 2>&1; then grpl gruim rebuild; fi
      start_dev app                # 4. Start dev mode \"app\" (see \"dev\" section)
  # You can run this pipeline via `devspace deploy` (or `devspace run-pipeline deploy`)
  deploy:
    run: |-
      patch-values-file
      run_dependencies --all                            # 1. Deploy any projects this project needs (see "dependencies")
      ensure_pull_secrets --all                         # 2. Ensure pull secrets
      build_images --all -t $(git describe --always)    # 3. Build, tag (git commit hash) and push all images (see "images")
      create_deployments --all                          # 4. Deploy Helm charts and manifests specfied as "deployments"
      reset-values-file
# This is a list of `images` that DevSpace can build for this project
# We recommend to skip image building during development (devspace dev) as much as possible
images:
  app:
    image: "${IMAGE_REGISTRY}/${IMAGE_REPO}:devspace"
    dockerfile: ./Dockerfile
    buildKit: # {} # implemented for bitbucket pipeline with the patch at the end of this file
      args: [--platform, 'linux/amd64,linux/arm64']
  test:
    image: "${IMAGE_REGISTRY}/${IMAGE_REPO}-test:devspace"
    dockerfile: ./Dockerfile.test
    buildKit: # {} # implemented for bitbucket pipeline with the patch at the end of this file
      args: [--platform, 'linux/amd64,linux/arm64']
  modules:
    image: "${MODULES_IMAGE}:devspace"
    dockerfile: ${MODULES_DOCKERFILE}
    buildKit:
      args: [--platform, 'linux/amd64,linux/arm64']
  # data:
  #   image: "${IMAGE_REGISTRY}/${IMAGE_REPO}-data:devspace"
  #   dockerfile: ./Dockerfile.data
  #   buildKit: # {} # implemented for bitbucket pipeline with the patch at the end of this file
  #     args: [--platform, 'linux/amd64,linux/arm64']
# This is a list of `deployments` that DevSpace can create for this project
deployments:
  app:
    # This deployment uses `helm` but you can also define `kubectl` deployments or kustomizations
    helm:
      releaseName: ${APP_NAME}
      # We are deploying this project with the Helm chart you provided
      chart:
        name: ./chart
      # Under `values` we can define the values for this Helm chart used during `helm install/upgrade`
      # You may also use `valuesFiles` to load values from files, e.g. valuesFiles: ["values.yaml"]
      valuesFiles:
        - ./chart/values.yaml
        - ./chart/values-dev.yaml
        - ./chart/values-devspace.yaml
        # copy chart/values-secret.example.yaml to this path and fill in the DAT
        # database credentials; without it the grapi pod has no datasource secret.
        - ./chart/values-secret.yaml
      values:
        DEV: "true"
# This is a list of `dev` containers that are based on the containers created by your deployments
dev:
  app:
    # Search for the container that runs this image
    labelSelector:
      app.kubernetes.io/instance: ${APP_NAME}
      app.kubernetes.io/name: grpl-dat-demo
    # Replace the container image with this dev-optimized image (allows to skip image building during development)
    devImage: "${IMAGE_REGISTRY}/${IMAGE_REPO}:devspace"
    # Sync files between the local filesystem and the development container
    env:
      - name: DEV
        value: "true"
    sync:
      - path: ./
        excludePaths:
          - node_modules
          - chart
          - data
          - dist
          - grases
        uploadExcludeFile: .dockerignore
    # Open a terminal and use the following command to start it
    terminal:
      command: (dos2unix ./rebuild.sh && ./rebuild.sh && sh) || sh
    # Inject a lightweight SSH server into the container (so your IDE can connect to the remote dev env)
    ssh:
      enabled: true
    # Make the following commands from my local machine available inside the dev container
    proxyCommands:
      - command: devspace
      - command: kubectl
      - command: helm
      - gitCredentials: true
    # Forward the following ports to be able access your application via localhost
    ports:
      # - port: "9229"
      - port: "4000"
    # Open the following URLs once they return an HTTP status code other than 502 or 503
    open:
      - url: http://localhost:4000
  gruim:
    labelSelector:
      app.kubernetes.io/name: gruim
      grpl.io/resourceName: ${APP_NAME}-gras-gruim
    devImage: grpl/gruim:0.3.62
    # The -img deployment starts nginx on a prebuilt image. The dev image has no
    # assets, so build them here and run the dev server instead.
    command:
      - sh
      - -c
      - |
        ./rebuild-assets.sh &&
        mkdir -p /tmp/devspace-custom-components ./src/lib/custom-components &&
        cp -R /tmp/devspace-custom-components/. ./src/lib/custom-components/ &&
        test -f ./src/lib/custom-components/list.json || printf '[]\n' > ./src/lib/custom-components/list.json &&
        ./rebuild-assets/sync.sh &&
        pnpm dev
    env:
      - name: DEV
        value: "true"
      # NODE_OPTIONS ipv4first need to be defined for fixing the ipv4 resolution in webpack http-proxy-middleware:
      # https://github.com/chimurai/http-proxy-middleware/issues/705
      # important for k3d deployments
      - name: NODE_OPTIONS
        value: "--dns-result-order=ipv4first"
    sync:
      - path: ./grases/gras/gruim/custommodules/.:/tmp/devspace-custom-components/.
        disableDownload: true
        initialSync: mirrorLocal
        startContainer: true
        excludePaths:
          - README.md
        # - name: OPENAPI_URL
        #   value: "http://dev-app-grapi.grpl-cli.grapple-demo.com/openapi.json"
    # restartHelper:
    #   inject: true
    #   path: "export DEV=true && ./rebuild-assets.sh"
    ports:
      - port: "8080:8080"
    open:
      - url: http://localhost:8080
  gruim-cache:
    labelSelector:
      app.kubernetes.io/name: gruim
      grpl.io/resourceName: ${APP_NAME}-grascache-gruim
    devImage: grpl/gruim:0.3.62
    command:
      - sh
      - -c
      - |
        ./rebuild-assets.sh &&
        mkdir -p /tmp/devspace-custom-components ./src/lib/custom-components &&
        cp -R /tmp/devspace-custom-components/. ./src/lib/custom-components/ &&
        test -f ./src/lib/custom-components/list.json || printf '[]\n' > ./src/lib/custom-components/list.json &&
        ./rebuild-assets/sync.sh &&
        pnpm dev
    env:
      - name: DEV
        value: "true"
      - name: NODE_OPTIONS
        value: "--dns-result-order=ipv4first"
    sync:
      - path: ./grases/grascache/gruim/custommodules/.:/tmp/devspace-custom-components/.
        disableDownload: true
        initialSync: mirrorLocal
        startContainer: true
        excludePaths:
          - README.md
    ports:
      - port: "8081:8080"
    open:
      - url: http://localhost:8081
  grapi:
    # Search for the container that runs this image
    labelSelector:
      app.kubernetes.io/name: grapi
      grpl.io/resourceName: ${APP_NAME}-gras-grapi
    devImage: grpl/loopback:0.4.25
    env:
      - name: DEV
        value: "true"
      - name: CustomControllerDir
        value: "injections"
      - name: CustomControllerDirs
        value: '{"controllerDirs": "injections"}'
      - name: CustomServiceDirs
        value: '{"serviceDirs": "serviceproviders"}'
    # TODO: path to the controller directory
    sync:
      # - path: ./grapi/controllers/:/home/node/app/src/controllers/
      - path: ./grases/gras/grapi/injections/:/home/node/app/src/injections/
    # restartHelper:
    #   inject: true
    #   path: "export DEV=true && ./start.sh"
    ports:
      - port: "3000:3000"
    open:
      - url: http://localhost:3000
# Use the `commands` section to define repeatable dev workflows for this project 
commands:
  gruim:
    command: |-
      devspace enter --label-selector app.kubernetes.io/name=gruim gruim $@
  grapi:
    command: |-
      devspace enter --label-selector app.kubernetes.io/name=grapi grapi $@
  migrate-db:
    command: |-
      devspace enter --label-selector app.kubernetes.io/name=grapi npm run build && \
      devspace enter --label-selector app.kubernetes.io/name=grapi npm run migrate

# Define dependencies to other projects with a devspace.yaml
# dependencies:
#   api:
#     git: https://...  # Git-based dependencies
#     tag: v1.0.0
#   ui:
#     path: ./ui        # Path-based dependencies (for monorepos)
# localRegistry:
#   enabled: false
# localRegistry:
#   localbuild: truede
profiles:
  - name: bitbucket
    activation:
      - vars:
          CI: true
    patches:
      - op: remove
        path: images.app.buildKit
      - op: remove
        path: images.data.buildKit
      - op: remove
        path: images.modules.buildKit

  - name: remove-buildkit-on-linux
    activation:
      - vars:
          DEVSPACE_LINUX: "true"
    patches:
      - op: remove
        path: images.app.buildKit
      - op: remove
        path: images.test.buildKit
      - op: remove
        path: images.data.buildKit
      - op: remove
        path: images.modules.buildKit
