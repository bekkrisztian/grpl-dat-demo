services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:80"
    environment:
      SVELTE_APP_REMOTE_URL: ${SVELTE_APP_REMOTE_URL:-}
      CONTAINER_NAME: ${CONTAINER_NAME:-}

# DAT backend services will be added once their credentials are available through
# local environment variables or a secret store. Credentials must not be committed.
