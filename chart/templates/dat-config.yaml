{{- $datDb := default dict (default dict .Values.secrets).datDb -}}
{{- if and $datDb.host $datDb.username $datDb.password }}
apiVersion: v1
kind: Secret
metadata:
  name: dat-db-config
type: Opaque
stringData:
  host: {{ $datDb.host | quote }}
  port: {{ default "3306" $datDb.port | quote }}
  username: {{ $datDb.username | quote }}
  password: {{ $datDb.password | quote }}
  database: {{ default "dsearchtree" $datDb.database | quote }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: dat-sqlcontrollers
type: Opaque
stringData:
  SQLController: >-
    vehicleTypes:{"query":"select FZA, FZAB from dsearchtree.datecode2 where FZA like \"${FZA}\" group by FZA, FZAB order by FZA;","path":"vehicleTypes","controllerName":"vehicleTypes"}|
    brands:{"query":"select HST, HSTB from dsearchtree.datecode2 where HST like \"${HST}\" group by HST, HSTB order by HSTB;","path":"brands","controllerName":"brands"}|
    modelRanges:{"query":"select OTG, OTGB from dsearchtree.datecode2 where OTG like \"${OTG}\" group by OTG, OTGB order by OTGB;","path":"modelRanges","controllerName":"modelRanges"}|
    modelGroups:{"query":"select HT, HTB from dsearchtree.datecode2 where HT like \"${HT}\" group by HT, HTB order by HTB;","path":"modelGroups","controllerName":"modelGroups"}|
    models:{"query":"select UT, UTB from dsearchtree.datecode2 where UT like \"${UT}\" group by UT, UTB order by UTB;","path":"models","controllerName":"models"}|
    brandsByVehicleType:{"query":"select FZA, HST, HSTB from dsearchtree.datecode2 where FZA = \"${FZA}\" group by FZA, HST, HSTB order by FZA, HSTB;","path":"brandsByVehicleType","controllerName":"brandsByVehicleType"}|
    modelRangeByVehicleTypeAndManufacturer:{"query":"select FZA, HST, HSTB, OTG, OTGB from dsearchtree.datecode2 where FZA = \"${FZA}\" and HST = \"${HST}\" group by FZA, HST, HSTB, OTG, OTGB order by FZA, OTGB;","path":"modelRangeByVehicleTypeAndManufacturer","controllerName":"modelRangeByVehicleTypeAndManufacturer"}|
    modelGroupByVehicleTypeAndManufacturerAndModelRange:{"query":"select FZA, HST, HSTB, OTG, OTGB, HT, HTB from dsearchtree.datecode2 where FZA = \"${FZA}\" and HST = \"${HST}\" and OTG = \"${OTG}\" group by FZA, HST, HSTB, OTG, OTGB, HT, HTB order by FZA, HSTB, OTGB;","path":"modelGroupByVehicleTypeAndManufacturerAndModelRange","controllerName":"modelGroupByVehicleTypeAndManufacturerAndModelRange"}|
    modelByVehicleTypeAndManufacturerAndModelGroup:{"query":"select FZA, HST, HSTB, HT, HTB, UT, UTB from dsearchtree.datecode2 where FZA = \"${FZA}\" and HST = \"${HST}\" and HT = \"${HT}\" group by FZA, HST, HSTB, HT, HTB, UT, UTB order by FZA, HSTB;","path":"modelByVehicleTypeAndManufacturerAndModelGroup","controllerName":"modelByVehicleTypeAndManufacturerAndModelGroup"}
---
apiVersion: v1
kind: Secret
metadata:
  name: dat-layer2-config
type: Opaque
stringData:
  # KubeBlocks serves the cache in this namespace and owns its password, which
  # reaches the pod through the <release>-redis-account-default secret.
  host: {{ printf "%s-redis-redis" .Release.Name | quote }}
  port: "6379"
  db: "0"
  MCP_CONFIGS: '{"enable":true}'
  LoggingConfigs: 'dsearchtree:{"loglevel":"info","httplog":true,"global":true,"group":"logging"}'
