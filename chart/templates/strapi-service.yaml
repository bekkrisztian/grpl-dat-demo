{{- if .Values.strapi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: grapple-aladv-strapi
  labels:
    app: grapple-strapi
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 1337
  - name: http2
    port: 5173
    protocol: TCP
    targetPort: 5173
  selector:
    app: grapple-aladv-strapi
--- 
apiVersion: v1
kind: Service
metadata:
  name: grapple-aladv-strapi-preview
  labels:
    app: grapple-aladv-strapi-preview
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3001
  selector:
    app: grapple-aladv-strapi # no postfix preview here as it has to match the pod label

{{- end }}