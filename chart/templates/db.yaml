{{- if not (lookup "apps.kubeblocks.io/v1" "Cluster" .Release.Namespace .Values.db.dbClusterName) }}
---
apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: {{ .Values.db.dbClusterName }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  clusterDef: apecloud-mysql
  topology: apecloud-mysql
  terminationPolicy: Delete
  schedulingPolicy:
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/managed-by: kubeblocks
              topologyKey: kubernetes.io/hostname
  componentSpecs:
    - name: mysql
      serviceVersion: 8.0.30
      replicas: 1
      resources:
        limits:
          cpu: "2"
          memory: 2Gi
        requests:
          cpu: "0.5"
          memory: 1Gi
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi
{{- end }}
