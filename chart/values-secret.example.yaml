# Only what must stay out of git. port and database keep the defaults from
# chart/values.yaml; override them here as well if your instance differs.
secrets:
  datDb:
    host: "your-dat-mysql-host"
    port: "3306"
    username: "your-dat-mysql-user"
    password: "your-dat-mysql-password"
    database: "dsearchtree"
  datRedis:
    host: "your-redis-host"
    port: "6379"
    username: "default"
    password: "your-redis-password"
    db: "0"
