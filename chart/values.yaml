stage: prd
env: {}
strapi:
  enabled: false
gras-deploy:
  enabled: false
grases:
  gras:
    enabled: true
    gras: {}
    grapi:
      name: dat-demo
      runimages:
        image: grpl/loopback
        tag: "0.4.25"
      discoveredrepos: true
      ingress: true
      ssl: true
      sslissuer: letsencrypt-grapple-demo
      autoscaling:
        maxReplicas: 3
      extraSecrets:
        - dat-demo-db-mysql-account-root
        - dat-sqlcontrollers
      env:
        - name: host
          value: "dat-demo-db-mysql"
        - name: port
          value: "3306"
        - name: database
          value: "dsearchtree"
      datasources:
        - name: dsearchtree
          spec:
            mysql:
              database: $(database)
              host: $(host)
              name: dsearchtree
              password: $(password)
              port: $(port)
              url: ""
              user: $(username)
      discoveries:
        - name: dsearchtree
          spec:
            all: true
            dataSource: dsearchtree
            disableCamelCase: false
            schema: $(database)
      restcruds:
        - name: dsearchtree
          spec:
            datasource: dsearchtree
      fuzzysearch:
        - name: datecode2
          content: 'dsearchtree:{"fuzzy":true,"centralFuzzy":false,"datasource":"dsearchtree","databaseName":"dsearchtree","appName":"Grpl","include":"datecode2","subPath":""}'
      models: []
      repositories: []
      relations: []
      openapis: []
      cacheconfigs: []
      controllers: []
      postpatches: []
      services: []
      serviceproviders: []
      prerelationpatches: []
      prepatches: []
      prediscoverypatches: []
      initContainers:
        - name: init-db
          spec:
            name: init-db
            image: grpl/grpl-dat-demo-data:dev
            imagePullPolicy: Always
            env:
              - name: host
                value: "dat-demo-db-mysql"
              - name: port
                value: "3306"
            command:
              - sh
              - -c
              - |
                until mysql -h "$(host)" -P "$(port)" -u "$(username)" -p"$(password)" -e "select 1" >/dev/null 2>&1; do
                  echo "waiting for mysql"
                  sleep 2
                done
                mysql -h "$(host)" -P "$(port)" -u "$(username)" -p"$(password)" -e "CREATE DATABASE IF NOT EXISTS dsearchtree;"
                loaded=$(mysql -h "$(host)" -P "$(port)" -u "$(username)" -p"$(password)" -N -B -e "select count(*) from dsearchtree.datecode2" 2>/dev/null || echo 0)
                if [ "$loaded" = "0" ]; then
                  echo "seeding dsearchtree.datecode2"
                  gzip -dc /seed/datecode2.sql.gz | mysql -h "$(host)" -P "$(port)" -u "$(username)" -p"$(password)" dsearchtree
                fi
                ensure_index() {
                  index_name="$1"
                  columns="$2"
                  exists=$(mysql -h "$(host)" -P "$(port)" -u "$(username)" -p"$(password)" -N -B -e "select count(*) from information_schema.statistics where table_schema='dsearchtree' and table_name='datecode2' and index_name='${index_name}'")
                  if [ "$exists" = "0" ]; then
                    mysql -h "$(host)" -P "$(port)" -u "$(username)" -p"$(password)" -e "create index ${index_name} on dsearchtree.datecode2 (${columns})"
                  fi
                }
                ensure_index idx_datecode2_hstb 'HSTB, HST'
                ensure_index idx_datecode2_hst 'HST'
                ensure_index idx_datecode2_otgb 'OTGB, OTG'
                ensure_index idx_datecode2_otg 'OTG'
                ensure_index idx_datecode2_htb 'HTB, HT'
                ensure_index idx_datecode2_ht 'HT'
                ensure_index idx_datecode2_utb 'UTB, UT'
                ensure_index idx_datecode2_ut 'UT'
        - name: init-modules
          spec:
            name: init-modules
            image: grpl/grpl-dat-demo-modules:dev
            imagePullPolicy: Always
            command: ["/bin/sh", "-c", "cp -r /modules/gras/. /opt/custom-modules/ && chown -R 1000:1000 /opt/custom-modules || true"]
            volumeMounts:
              - name: custom-modules
                mountPath: /opt/custom-modules
      volumeMounts:
        - name: custom-modules
          mountPath: /opt/custom-modules
      volumes:
        - name: custom-modules
          emptyDir: {}
    gruim:
      name: dat-demo
      runimages:
        image: grpl/gruim
        tag: "0.3.62"
      ssl: true
      sslissuer: letsencrypt-grapple-demo
      autoscaling:
        maxReplicas: 3
      style: '{"colors":{"primary":"#1451cb"}}'
      config: '{"global":{"fetch-page-size":1000,"max-records":50000}}'
      additionalpackages: ""
      custommodules: []
      prepatches: []
      postpatches: []
  grascache:
    enabled: true
    gras: {}
    grapi:
      name: dat-demo-cache
      runimages:
        image: grpl/loopback
        tag: "0.4.25"
      discoveredrepos: false
      ingress: true
      ssl: true
      sslissuer: letsencrypt-grapple-demo
      autoscaling:
        maxReplicas: 1
      extraSecrets:
        - dat-layer2-config
        - dat-demo-redis-account-default
      initContainers:
        - name: init-redis
          spec:
            name: init-redis
            image: redis:7.2
            command:
              - sh
              - -c
              - |
                until redis-cli -h $(host) -p $(port) -a $(password) PING | grep -q PONG; do
                  echo "cache is not available yet"
                  sleep 2
                done
        - name: wait-for-dat-api
          spec:
            name: wait-for-dat-api
            image: curlimages/curl:8.7.1
            command:
              - sh
              - -c
              - |
                until curl -sf http://gras-grapi:3000/openapi.json >/dev/null; do
                  echo "DAT layer one is not available yet"
                  sleep 5
                done
      datasources:
        - name: redis
          spec:
            kv-redis:
              db: $(db)
              host: $(host)
              name: redis
              password: $(password)
              port: $(port)
              url: ""
      openapis:
        - name: dsearchtree
          spec:
            url: http://gras-grapi:3000/openapi.json
            prefix: dsearchtree
            client: true
      cacheconfigs:
        - name: dsearchtree
          spec:
            openApis: dsearchtree
            redisDS: redis
            cacheTTL: 6000000
      models: []
      repositories: []
      relations: []
      controllers: []
      postpatches: []
      services: []
      serviceproviders: []
      prerelationpatches: []
      prepatches: []
      prediscoverypatches: []
replicaCount: 1
image:
  repository: grpl/grpl-dat-demo
  pullPolicy: Always
  tag: "devspace"
imagetest:
  repository: grpl/grpl-dat-demo-test
  pullPolicy: Always
  tag: ""
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  annotations: {}
  name: ""
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 80
lookup:
  enabled: true
  productName: dat-demo
  domain: MYDOMAIN.grpl.io
  sslissuer: MYISSUER
ingress:
  enabled: true
  className: ""
  ssl: true
  annotations: {}
  hosts: []
  tls: []
resources: {}
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
nodeSelector: {}
tolerations: []
affinity: {}
