# Default values for myapp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

strapi:
  enabled: true
  HOST: "0.0.0.0"
  PORT: "1337"
  APP_KEYS: ""
  API_TOKEN_SALT: ""
  ADMIN_JWT_SECRET: ""
  TRANSFER_TOKEN_SALT: ""
  ENCRYPTION_KEY: ""
  JWT_SECRET: ""
stage: prd
env: {}
db:
  dbClusterName: svelte-template-db
# configuration for grapple ApplicationSet (gras)
gras-deploy:
  enabled: false
grases:
  gras:
    enabled: true
    gras: {}
    grapi:
      runimages:
        image: grpl/grapi
        tag: "0.2.9"
      discoveredrepos: true
      ingress: true
      ssl: true
      sslissuer: letsencrypt-grapple-demo
      initContainers:
        - name: test
          spec:
            name: init-db
            image: mysql
            command:
              - bash
              - -c
              - sleep 5; while ! mysql -h $(host) -P $(port) -u $(username) -p$(password) -e "show databases;" 2>/dev/null; do echo -n .; sleep 2; done; if mysql -h $(host) -P $(port) -u $(username) -p$(password) -e "USE classicmodelsid; SET @tablename := (select table_name from information_schema.tables where table_type = 'BASE TABLE' and table_schema = 'classicmodelsid' limit 1); set @qry1:= concat('select * from ',@tablename,' limit 1'); prepare stmt from @qry1 ; execute stmt ;" ; then echo "database already exists..."; else curl -o /tmp/classicmodelsid.sql https://raw.githubusercontent.com/grapple-solutions/grapple-test-data/main/classicmodelsid/classicmodelsid.sql; mysql -h $(host) -P $(port) -u $(username) -p$(password) < /tmp/classicmodelsid.sql; fi
        - name: init-modules
          spec:
            name: init-modules
            image: grpl/grapple-svelte-template-modules:0.1.0.dev
            imagePullPolicy: Always
            command: ["/bin/sh", "-c", "cp -r /modules/gras/* /opt/custom-modules/ && chown -R 1000:1000 /opt/custom-modules || true"]
            volumeMounts:
              - name: custom-modules
                mountPath: /opt/custom-modules
      volumeMounts:
        - name: custom-modules
          mountPath: /opt/custom-modules
      volumes:
        - name: custom-modules
          emptyDir: {}
      extraSecrets:
        - svelte-template-db-conn-credential
      # volumes:
      #   - name: data
      #     emptyDir: {}
      #     # persistentVolumeClaim: 
      #     #   claimName: grapi-dbfile
      # volumeMounts:
      #   - name: data
      #     mountPath: /data
      # datasources:
      #   - name: "db"
      #     spec:
      #       memory:
      #         connector: "memory"
      #         name: "db"
      #         file: "/data/db.json"
      #         localStorage: "db"
      datasources:
        - name: classicmodelsid
          spec:
            mysql:
              database: classicmodelsid
              host: $(host)
              name: classicmodelsid
              password: $(password)
              port: $(port)
              url: ""
              user: $(username)
      discoveries:
        - name: classicmodelsid
          spec:
            all: true
            dataSource: classicmodelsid
            disableCamelCase: false
            schema: classicmodelsid
      # models:
      #   - name: "clients"
      #     spec:
      #       name: clients
      #       base: Entity
      #       properties:
      #         id:
      #           type: number
      #           id: true
      #           required: true
      #           generated: true
      #         customerName:
      #           type: string
      #         customerLastname:
      #           type: string
      #         contactFirstName:
      #           type: string
      #         phone:
      #           type: string
      #         addressLine1:
      #           type: string
      #         addressLine2:
      #           type: string
      #         city:
      #           type: string
      #         state:
      #           type: string
      #         postalCode:
      #           type: string
      #         country:
      #           type: string
      #         creditLimit:
      #           type: number
      # repositories:
      #   - name: classicmodelsid
      #     spec:
      #       datasource: classicmodelsid
      #       model: clients
      # relations:
      #   - name: "employees"
      #     spec:
      #       relationName: "employees"
      #       sourceModel: "Customers"
      #       destinationModel: "Employees"
      #       foreignKeyName: "employeesId"
      #       relationType: "belongsTo"
      #       registerInclusionResolver: true
      relations:
        - name: employees
          spec:
            destinationModel: Employees
            foreignKeyName: employeesId
            registerInclusionResolver: true
            relationName: employees
            relationType: belongsTo
            sourceModel: Customers
      restcruds:
        - name: "classicmodelsid"
          spec:
            datasource: "classicmodelsid"
      controllers: []
      postpatches: []
      injections: []
      prerelationpatches: []
      prepatches: []
    gruim:
      runimages:
        tag: 0.2.9
        name: grpl/gruim
      ssl: true
      sslissuer: letsencrypt-grapple-demo
      style: '{"colors":{"primary":{"DEFAULT":"#34344A","fg":"#fff"},"accent":{"DEFAULT":"#CC5A71","fg":"#fff"}}}'
      config: ""
      additionalpackages: ""
      custommodules: []
replicaCount: 1
image:
  repository: grpl/grapple-svelte-template
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.1.0.dev-c970a67"
imagetest:
  repository: grpl/grapple-svelte-template-test
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.1.0.dev-c970a67"
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
podAnnotations: {}
podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
# capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP
  port: 80
lookup:
  enabled: true
  domain: MYDOMAIN.grpl.io
  sslissuer: MYISSUER
ingress:
  enabled: true
  className: ""
  ssl: true
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  # hosts:
  #   - host: chart-example.local
  #     paths:
  #       - path: /
  #         pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
resources: {}
# We usually recommend not to specify default resources and to leave this as a conscious
# choice for the user. This also increases chances charts run on environments with little
# resources, such as Minikube. If you do want to specify resources, uncomment the following
# lines, adjust them as necessary, and remove the curly braces after 'resources:'.
# limits:
#   cpu: 100m
#   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
nodeSelector: {}
tolerations: []
affinity: {}
