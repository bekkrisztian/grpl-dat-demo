stage: prd
env: {}
strapi:
  enabled: false
secrets:
  datDb:
    host: ""
    port: "3306"
    username: ""
    password: ""
    database: "dsearchtree"
gras-deploy:
  enabled: false
grases:
  gras:
    enabled: true
    gras: {}
    grapi:
      name: dat-demo
      runimages:
        image: grpl/loopback
        tag: "0.4.25"
      discoveredrepos: true
      ingress: true
      ssl: true
      sslissuer: letsencrypt-grapple-demo
      autoscaling:
        maxReplicas: 3
      extraSecrets:
        - dat-db-config
        - dat-sqlcontrollers
      datasources:
        - name: dsearchtree
          spec:
            mysql:
              database: $(database)
              host: $(host)
              name: dsearchtree
              password: $(password)
              port: $(port)
              url: ""
              user: $(username)
      discoveries:
        - name: dsearchtree
          spec:
            all: true
            dataSource: dsearchtree
            disableCamelCase: false
            schema: $(database)
      restcruds:
        - name: dsearchtree
          spec:
            datasource: dsearchtree
      models: []
      repositories: []
      relations: []
      openapis: []
      cacheconfigs: []
      controllers: []
      postpatches: []
      services: []
      serviceproviders: []
      prerelationpatches: []
      prepatches: []
      prediscoverypatches: []
      initContainers:
        - name: init-modules
          spec:
            name: init-modules
            image: grpl/grpl-dat-demo-modules:dev
            imagePullPolicy: Always
            command: ["/bin/sh", "-c", "cp -r /modules/gras/. /opt/custom-modules/ && chown -R 1000:1000 /opt/custom-modules || true"]
            volumeMounts:
              - name: custom-modules
                mountPath: /opt/custom-modules
      volumeMounts:
        - name: custom-modules
          mountPath: /opt/custom-modules
      volumes:
        - name: custom-modules
          emptyDir: {}
    gruim:
      name: dat-demo
      runimages:
        image: grpl/gruim
        tag: "0.3.62"
      ssl: true
      sslissuer: letsencrypt-grapple-demo
      autoscaling:
        maxReplicas: 3
      style: '{"colors":{"primary":"#1451cb"}}'
      config: ""
      additionalpackages: ""
      custommodules: []
      prepatches: []
      postpatches: []
replicaCount: 1
image:
  repository: grpl/grpl-dat-demo
  pullPolicy: Always
  tag: "devspace"
imagetest:
  repository: grpl/grpl-dat-demo-test
  pullPolicy: Always
  tag: ""
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  annotations: {}
  name: ""
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 80
lookup:
  enabled: true
  productName: dat-demo
  domain: MYDOMAIN.grpl.io
  sslissuer: MYISSUER
ingress:
  enabled: true
  className: ""
  ssl: true
  annotations: {}
  hosts: []
  tls: []
resources: {}
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
nodeSelector: {}
tolerations: []
affinity: {}
